<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Бронювання столика — Жемчужина Еґейського моря</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --black: #050505;
            --black-light: #0b0b0b;
            --gold: #d4af37;
            --gold-light: #f4d76b;
            --gold-dark: #927019;
            --text: #f5f0df;
            --muted: #969185;
            --success: #cbb65b;
        }

        body {
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            position: relative;

            padding: 40px 20px;

            background:
                radial-gradient(
                    circle at center,
                    rgba(212, 175, 55, 0.08),
                    transparent 40%
                ),
                #050505;

            color: var(--text);

            font-family:
                Georgia,
                "Times New Roman",
                serif;

            overflow-x: hidden;
        }


        /* =========================================
           БОКОВЫЕ ЗОЛОТЫЕ ЛИНИИ
        ========================================= */

        body::before,
        body::after {

            content: "";

            position: fixed;

            top: 0;
            bottom: 0;

            width: 1px;

            background:
                linear-gradient(
                    to bottom,
                    transparent,
                    rgba(212, 175, 55, 0.35),
                    rgba(212, 175, 55, 0.08),
                    rgba(212, 175, 55, 0.35),
                    transparent
                );

            pointer-events: none;
        }

        body::before {
            left: 24px;
        }

        body::after {
            right: 24px;
        }


        /* =========================================
           ДЕКОРАТИВНЫЕ КРУГИ
        ========================================= */

        .circle-left {

            position: fixed;

            width: 520px;
            height: 520px;

            left: -300px;
            top: -250px;

            border:
                1px solid
                rgba(212, 175, 55, 0.14);

            border-radius: 50%;

            pointer-events: none;
        }

        .circle-right {

            position: fixed;

            width: 600px;
            height: 600px;

            right: -350px;
            bottom: -330px;

            border:
                1px solid
                rgba(212, 175, 55, 0.12);

            border-radius: 50%;

            pointer-events: none;
        }


        /* =========================================
           ОСНОВНОЙ БЛОК
        ========================================= */

        .reservation-container {

            position: relative;

            z-index: 5;

            width: min(500px, 92%);

            padding: 42px;

            background:
                linear-gradient(
                    145deg,
                    rgba(17, 17, 15, 0.98),
                    rgba(7, 7, 7, 0.98)
                );

            border:
                1px solid
                rgba(212, 175, 55, 0.38);

            box-shadow:
                0 25px 70px
                rgba(0, 0, 0, 0.7),

                0 0 35px
                rgba(212, 175, 55, 0.05);
        }


        .reservation-container::before {

            content: "";

            position: absolute;

            top: -1px;

            left: 12%;
            right: 12%;

            height: 2px;

            background:
                linear-gradient(
                    90deg,
                    transparent,
                    var(--gold),
                    transparent
                );
        }


        /* =========================================
           ЛОГО
        ========================================= */

        .logo {

            text-align: center;

            color: var(--text);

            font-size: 19px;

            font-weight: bold;

            letter-spacing: 1px;
        }

        .logo-symbol {

            color: var(--gold);

            margin-right: 7px;
        }

        .logo-gold {

            color: var(--gold);
        }


        /* =========================================
           ЗАГОЛОВОК
        ========================================= */

        .reservation-container h1 {

            margin-top: 28px;

            text-align: center;

            color: var(--text);

            font-size: 36px;

            font-weight: normal;
        }

        .subtitle {

            margin-top: 10px;

            text-align: center;

            color: var(--muted);

            font-family: Arial, sans-serif;

            font-size: 13px;

            line-height: 1.6;
        }


        /* =========================================
           ЗОЛОТАЯ ЛИНИЯ
        ========================================= */

        .gold-line {

            position: relative;

            width: 190px;

            height: 1px;

            margin: 23px auto 30px;

            background:
                linear-gradient(
                    90deg,
                    transparent,
                    var(--gold),
                    transparent
                );
        }

        .gold-line::before,
        .gold-line::after {

            content: "";

            position: absolute;

            top: 50%;

            width: 6px;

            height: 6px;

            border:
                1px solid
                var(--gold);

            transform:
                translateY(-50%)
                rotate(45deg);
        }

        .gold-line::before {
            left: 25px;
        }

        .gold-line::after {
            right: 25px;
        }


        /* =========================================
           FORM
        ========================================= */

        form {

            display: flex;

            flex-direction: column;

            gap: 16px;
        }


        /* =========================================
           LABEL
        ========================================= */

        .form-label {

            margin-bottom: -7px;

            color: var(--gold);

            font-family: Arial, sans-serif;

            font-size: 11px;

            font-weight: bold;

            letter-spacing: 1.3px;

            text-transform: uppercase;
        }


        /* =========================================
           SELECT + DATETIME
        ========================================= */

        select,
        input[type="datetime-local"] {

            width: 100%;

            padding: 15px 16px;

            color: var(--text);

            background: #080808;

            border:
                1px solid
                rgba(212, 175, 55, 0.25);

            outline: none;

            font-family: Arial, sans-serif;

            font-size: 13px;

            transition: 0.3s ease;

            color-scheme: dark;
        }

        select:focus,
        input[type="datetime-local"]:focus {

            border-color:
                var(--gold);

            background: #0b0b0b;

            box-shadow:
                0 0 18px
                rgba(212, 175, 55, 0.08);
        }

        select option {

            background: #0b0b0b;

            color: var(--text);
        }


        /* =========================================
           LOCATION INFO
        ========================================= */

        .location-info {

            display: flex;

            align-items: center;

            gap: 10px;

            padding: 13px 15px;

            color: var(--muted);

            background:
                rgba(212, 175, 55, 0.025);

            border:
                1px solid
                rgba(212, 175, 55, 0.15);

            font-family: Arial, sans-serif;

            font-size: 11px;

            line-height: 1.5;
        }

        .location-icon {

            color: var(--gold);

            font-size: 17px;
        }


        /* =========================================
           BUTTON
        ========================================= */

        button {

            width: 100%;

            margin-top: 8px;

            padding: 15px;

            border:
                1px solid
                var(--gold-light);

            color: #050505;

            background:
                linear-gradient(
                    135deg,
                    var(--gold-dark),
                    var(--gold-light),
                    var(--gold-dark)
                );

            font-family: Arial, sans-serif;

            font-size: 12px;

            font-weight: bold;

            letter-spacing: 1.8px;

            cursor: pointer;

            transition: 0.3s ease;
        }

        button:hover {

            transform:
                translateY(-2px);

            box-shadow:
                0 0 25px
                rgba(212, 175, 55, 0.25);
        }

        button:active {

            transform:
                translateY(0);
        }


        /* =========================================
           MESSAGE
        ========================================= */

        .message {

            margin-top: 22px;

            padding: 14px 16px;

            text-align: center;

            color: var(--success);

            background:
                rgba(212, 175, 55, 0.05);

            border:
                1px solid
                rgba(212, 175, 55, 0.3);

            font-family: Arial, sans-serif;

            font-size: 13px;

            line-height: 1.6;
        }


        /* =========================================
           HOME
        ========================================= */

        .back-home {

            display: block;

            margin-top: 22px;

            text-align: center;

            color: #625f57;

            text-decoration: none;

            font-family: Arial, sans-serif;

            font-size: 11px;

            transition: 0.3s ease;
        }

        .back-home:hover {

            color: var(--gold);
        }


        /* =========================================
           MOBILE
        ========================================= */

        @media (max-width: 600px) {

            body::before {
                left: 10px;
            }

            body::after {
                right: 10px;
            }

            .reservation-container {

                padding:
                    35px 25px;
            }

            .reservation-container h1 {

                font-size: 30px;
            }
        }

    </style>
</head>


<body>


<div class="circle-left"></div>
<div class="circle-right"></div>


<div class="reservation-container">


    <!-- ЛОГО -->

    <div class="logo">

        <span class="logo-symbol">
            ✦
        </span>

        Жемчужина

        <span class="logo-gold">
            Эгейского моря
        </span>

    </div>


    <!-- ЗАГОЛОВОК -->

    <h1>
        Бронювання столика
    </h1>


    <p class="subtitle">
        Оберіть кількість гостей та зручний
        для вас час відвідування.
    </p>


    <div class="gold-line"></div>


    <!-- FORM -->

    <form method="post">

        <input
            type="hidden"
            name="csrf_token"
            value="{{ csrf_token }}"
        >


        <!-- ТИП СТОЛИКА -->

        <label class="form-label">
            Тип столика
        </label>

        <select name="table_type">

            <option value="1-2">
                1–2 людини
            </option>

            <option value="3-4">
                3–4 людини
            </option>

            <option value="4+">
                Більше 4-х людей
            </option>

        </select>


        <!-- ДАТА И ВРЕМЯ -->

        <label class="form-label">
            Дата та час
        </label>

        <input
            type="datetime-local"
            name="time"
            required
        >


        <!-- GEOLOCATION -->

        <input
            type="hidden"
            name="latitude"
            id="latitude"
        >

        <input
            type="hidden"
            name="longitude"
            id="longitude"
        >


        <div class="location-info">

            <span class="location-icon">
                ◉
            </span>

            <span>
                Ваша геолокація буде використана
                для визначення місця бронювання.
            </span>

        </div>


        <!-- BUTTON -->

        <button type="submit">
            ЗАБРОНЮВАТИ СТОЛИК
        </button>

    </form>


    <!-- MESSAGE -->

    {% if message %}

        <div class="message">
            {{ message }}
        </div>

    {% endif %}


    <!-- HOME -->

    <a
        href="{{ url_for('home') }}"
        class="back-home"
    >
        ← Повернутися на головну
    </a>


</div>


<script nonce="{{nonce}}">

    window.onload = function() {

        if (navigator.geolocation) {

            navigator.geolocation.getCurrentPosition(

                function (position) {

                    document.getElementById("latitude").value =
                        position.coords.latitude;

                    document.getElementById("longitude").value =
                        position.coords.longitude;

                },

                function (error) {

                    console.error(
                        "Геолокацію не вдалося отримати:",
                        error
                    );

                }

            );

        } else {

            console.warn(
                "Геолокація не підтримується у вашому браузері."
            );

        }

    };

</script>


</body>
</html>
